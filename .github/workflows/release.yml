name: Release

# Builds, signs, notarises and publishes magpie. Pushing a v* tag on
# yetone/magpie dispatches here, and the builds land on this repo's
# Releases, where anyone can download them: the desktop app for macOS,
# Windows and Linux, and the terminal-only build for every platform.
#
# macOS signing is optional: without MAC_CERTIFICATE_P12 the app is only
# ad-hoc signed (still runs after right-click → Open). With it the app is
# signed with the Developer ID under the hardened runtime, the dmg notarised
# and the ticket stapled to both the dmg and the app inside the zip.
# Notarisation takes an App Store Connect API key (APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER) or, failing that, an Apple ID
# (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).
#
# The Windows and Linux apps are not signed. Each is launched on its own
# platform before the release goes out: it must stay up and serve the
# gateway.
#
# The source is checked out with MAGPIE_DEPLOY_KEY, a read-only deploy key
# on yetone/magpie.

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref of yetone/magpie to build (tag or branch)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g., 0.1.0 — no v prefix)'
        required: true
        type: string
      publish:
        description: 'Publish the release (off: build only, as a dry run)'
        type: boolean
        default: true

env:
  REF: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
  VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/magpie
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Probe macOS signing secrets
        id: signing
        env:
          P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::MAC_CERTIFICATE_P12 not set — the mac build will be ad-hoc signed and not notarised."
          fi

      - name: Import macOS certificates
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f $RUNNER_TEMP/certificate.p12

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in MAC_CERTIFICATE_P12"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> $GITHUB_ENV

          # codesign --timestamp asks Apple's timestamp server, which now and
          # then doesn't answer: "A timestamp was expected but was not
          # found" failed v0.1.3360's Intel build, and its rerun published
          # it after 3361 and 3362 (11-09). That one error is tried again;
          # any other fails at once.
          cat > "$RUNNER_TEMP/sign.sh" <<'EOF'
          sign() {
            local try out
            for try in 1 2 3; do
              if out=$(codesign "$@" 2>&1); then
                [ -z "$out" ] || echo "$out"
                return 0
              fi
              echo "$out" >&2
              case "$out" in
                *"timestamp was expected but was not found"*) ;;
                *) return 1 ;;
              esac
              [ "$try" -lt 3 ] || return 1
              echo "Apple's timestamp server didn't answer (try $try), signing again in $((try * 20))s"
              sleep $((try * 20))
            done
          }
          EOF

      - name: Build magpie.app
        run: make app VERSION="$VERSION"

      - name: Sign magpie.app
        run: |
          if [ -n "$IDENTITY" ]; then
            . "$RUNNER_TEMP/sign.sh"
            sign --force --options runtime --timestamp --sign "$IDENTITY" magpie.app
          else
            codesign --force --sign - magpie.app
          fi
          codesign --verify --strict --verbose=2 magpie.app
          codesign -dv --verbose=2 magpie.app 2>&1 | grep -E 'Authority|TeamIdentifier|flags|Identifier'

      - name: Build dmg
        run: |
          DMG=magpie-darwin-${{ matrix.arch }}.dmg
          mkdir -p $RUNNER_TEMP/dmg
          cp -R magpie.app $RUNNER_TEMP/dmg/
          ln -s /Applications $RUNNER_TEMP/dmg/Applications
          # The Intel runners' hdiutil fails now and then with "create
          # failed - Resource busy" while something still holds the image
          # it makes; the release was lost each time (yetone/magpie#1846).
          # The image's size is given, not left to hdiutil's guess from the
          # folder: on the Intel runners the guess came out short and every
          # try failed "No space left on device" copying magpie.app in
          # (v0.1.1911, 1913, 1915, 1918 and 1921 lost on 10-28).
          SIZE=$(( $(du -sm $RUNNER_TEMP/dmg | cut -f1) * 5 / 4 + 32 ))m
          for try in 1 2 3 4 5; do
            hdiutil create -volname magpie -srcfolder $RUNNER_TEMP/dmg -size $SIZE -ov -format UDZO "$DMG" && break
            [ "$try" = 5 ] && exit 1
            echo "hdiutil create failed (try $try), trying again"
            rm -f "$DMG"
            sleep $((try * 10))
          done
          if [ -n "$IDENTITY" ]; then
            . "$RUNNER_TEMP/sign.sh"
            sign --force --timestamp --sign "$IDENTITY" "$DMG"
          fi
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Notarise and staple
        # notarytool's --timeout bounds only its wait for Apple: v0.1.3737's
        # step hung past 90 minutes holding a macOS runner, and a job's own
        # limit is six hours. 30m of waiting, the upload and stapling fit.
        timeout-minutes: 45
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > $RUNNER_TEMP/AuthKey.p8
            AUTH=(--key $RUNNER_TEMP/AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          # The dmg's ticket covers the app inside it too, so one submission
          # does for both: staple the dmg, and the app for the zip.
          OUT=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m --output-format json)
          echo "$OUT"
          ID=$(echo "$OUT" | jq -r .id)
          STATUS=$(echo "$OUT" | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f $RUNNER_TEMP/AuthKey.p8
            echo "::error::Notarisation $STATUS"
            exit 1
          fi
          rm -f $RUNNER_TEMP/AuthKey.p8
          # stapler fetches the ticket from Apple's CloudKit, which drops the
          # connection now and then (error 68): try again, and if it is still
          # down, ship the build unstapled. It is notarised (Accepted above),
          # so Gatekeeper looks the ticket up online on first open; failing
          # here left whole releases unpublished (#2778: v0.1.1284, 1385,
          # 1386, 1541, 1824, 1827).
          stapled=1
          staple() {
            for i in 1 2 3 4 5; do
              xcrun stapler staple "$1" && return 0
              echo "staple $1 failed (try $i), retrying in $((i * 20))s"
              sleep $((i * 20))
            done
            echo "::warning::$1 ships notarised but unstapled: Apple's ticket service stayed unreachable"
            stapled=0
          }
          staple "$DMG"
          staple magpie.app
          if [ "$stapled" = 1 ]; then
            spctl --assess --type execute --verbose=2 magpie.app
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          else
            # spctl would ask the same unreachable service; the signature is
            # still checked, offline
            codesign --verify --deep --strict --verbose=2 magpie.app
            codesign --verify --strict --verbose=2 "$DMG"
          fi

      - name: Zip magpie.app
        run: ditto -c -k --keepParent magpie.app magpie-darwin-${{ matrix.arch }}.zip

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-darwin-${{ matrix.arch }}
          path: |
            magpie-darwin-*.dmg
            magpie-darwin-*.zip
          if-no-files-found: error

  # The terminal-only magpie (no GUI, no cgo) and the Windows app (WebView2,
  # no cgo either) cross-compile from one runner.
  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/magpie
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make release-cli release-windows VERSION="$VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-cli
          path: |
            dist/magpie-cli-*
            dist/magpie-windows-*.exe
          if-no-files-found: error

  # Launch the Windows app for real: it has to come up and serve the gateway.
  windows-check:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-cli
          path: dist

      - name: Launch magpie
        shell: pwsh
        run: |
          $exe = "dist\magpie-windows-${{ matrix.arch }}.exe"
          $v = (& $exe --version | Out-String).Trim()
          Write-Output $v
          if ($v -notlike "magpie $env:VERSION*") { throw "unexpected version: $v" }
          $log = "$env:RUNNER_TEMP\magpie"
          $p = Start-Process -FilePath $exe -ArgumentList app -PassThru -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          function Fail($why) { Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue; throw $why }
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Fail "magpie exited with $($p.ExitCode)" }
            try { Invoke-WebRequest http://127.0.0.1:3425/v1/models -UseBasicParsing | Out-Null; $ok = $true; break } catch {}
          }
          if (-not $ok) { Fail "the gateway never answered" }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { Fail "magpie exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Output "magpie ran and served the gateway"

  # The Linux app links GTK 3 and WebKitGTK 4.1, so each arch builds on its
  # own runner. Ubuntu 22.04 keeps the glibc requirement low.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/magpie
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        # v0.1.3772 to v0.1.3774 sat in this step for over an hour with no
        # limit (a job's own is six hours): a stalled apt is cut after 5
        # minutes and tried again, three times
        timeout-minutes: 20
        # 11-11: archive.ubuntu.com and azure.archive.ubuntu.com stopped
        # answering for hours and every v0.1.3772 to v0.1.3781 run failed
        # here. After the first try, apt goes to another mirror; packages
        # are still checked against Ubuntu's signing key, so a mirror only
        # decides whether apt gets them, not what they are
        run: |
          for i in 1 2 3; do
            if [ "$i" = 2 ]; then
              if [ "${{ matrix.arch }}" = arm64 ]; then m=http://mirror.yandex.ru/ubuntu-ports; else m=http://mirrors.edge.kernel.org/ubuntu; fi
              echo "using $m"
              sudo sed -i -E "s#https?://[^ ]*(archive|ports|security)\.ubuntu\.com/ubuntu(-ports)?#$m#g" /etc/apt/sources.list
              sudo find /etc/apt/sources.list.d -name '*.sources' -exec sed -i -E "s#https?://[^ ]*(archive|ports|security)\.ubuntu\.com/ubuntu(-ports)?#$m#g" {} +
              # amd64 runners list their archives in a mirror+file: list
              # (azure.archive.ubuntu.com, archive.ubuntu.com), which the
              # seds above don't reach
              if [ -f /etc/apt/apt-mirrors.txt ]; then echo "$m" | sudo tee /etc/apt/apt-mirrors.txt; fi
              grep -h '^deb ' /etc/apt/sources.list | head -3
            fi
            sudo timeout 300 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
              sudo timeout 300 apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11 && exit 0
            echo "apt attempt $i failed; trying again"
            sleep 10
          done
          exit 1

      - name: Build
        run: make release-linux VERSION="$VERSION"

      - name: Launch magpie
        run: |
          BIN=dist/magpie-linux-${{ matrix.arch }}
          $BIN --version | grep -F "magpie $VERSION"
          export HOME=$(mktemp -d)
          # no update: a release published while this one builds is newer,
          # and the app would download it beside itself as $BIN.new, which
          # went out as v0.1.1611's magpie-linux-amd64.new (15.8MB of 1612)
          export MAGPIE_UPDATE_FEED=http://127.0.0.1:9/
          xvfb-run -a dbus-launch --exit-with-session $BIN app > $RUNNER_TEMP/magpie.log 2>&1 &
          for i in $(seq 30); do
            sleep 2
            curl -fs -o /dev/null http://127.0.0.1:3425/v1/models && break
          done
          sleep 5
          curl -fs -o /dev/null http://127.0.0.1:3425/v1/models || { cat $RUNNER_TEMP/magpie.log; echo "::error::magpie did not come up"; exit 1; }
          pkill -f "$BIN" || true
          echo "magpie ran and served the gateway"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist/magpie-linux-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [mac, cli, windows-check, linux]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/magpie
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}
          fetch-depth: 0
          fetch-tags: true

      # here, not beside the tap's update: scripts/notes.sh writes the notes
      - name: Checkout magpie-releases
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          path: tap

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -la

      # magpie only installs an update whose SHA256SUMS this signature
      # vouches for (internal/update/signed.go in yetone/magpie): the feed
      # at usemagpie.ai only carries them. The signed text is the line
      # "magpie release <version>" and SHA256SUMS, so a signature for one
      # version is no good for another. SHA256SUMS.sig is the signature in
      # base64. The private key is the UPDATE_SIGNING_KEY secret of this
      # repo and nowhere else; the app holds the public half.
      - name: Sign checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # raw public key, base64: must be the one built into magpie
          EXPECTED_PUBLIC: 3XuYQEohIRDF+zxGQry1iXGZ1cfKYFX3vsST6GSSbYQ=
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set: an unsigned release would be refused by every updater"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64)
          if [ "$pub" != "$EXPECTED_PUBLIC" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not the key magpie trusts"
            exit 1
          fi
          msg="$RUNNER_TEMP/signed-msg"
          { printf 'magpie release %s\n' "$VERSION"; cat dist/SHA256SUMS; } > "$msg"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$msg" -out "$RUNNER_TEMP/sig.bin"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in "$msg" -sigfile "$RUNNER_TEMP/sig.bin"
          base64 < "$RUNNER_TEMP/sig.bin" | tr -d '\n' > dist/SHA256SUMS.sig
          echo >> dist/SHA256SUMS.sig
          ls -la dist/SHA256SUMS.sig

      # The notes are written by scripts/notes.sh (DeepSeek's changelog,
      # then its Chinese); notes.yml writes again, each hour, those of a
      # release DeepSeek turned away (a spent balance: v0.1.2634 to 2646)
      - name: Generate changelog
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # read-only lookups of who opened the issues the commits name
          GH_TOKEN: ${{ github.token }}
        run: tap/scripts/notes.sh "v$VERSION" HEAD "$RUNNER_TEMP"

      # GitHub marks the release published last as Latest, and usemagpie.ai's
      # /api/latest (the update feed and the downloads) serves Latest. A
      # release whose notarisation ran long went out after newer ones and
      # took the mark from them (v0.1.1255 on 10-15; v0.1.1891 over 1892 on
      # 10-28), so this one is Latest only when no published one is newer.
      - name: Latest only when newest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make=$(tap/scripts/latest.sh is-newest "$GITHUB_REPOSITORY" "v$VERSION")
          [ "$make" = true ] || echo "$(tap/scripts/latest.sh newest "$GITHUB_REPOSITORY") is newer: v$VERSION is published without the Latest mark"
          echo "make=$make" >> "$GITHUB_OUTPUT"

      # The action only makes the draft and uploads to it: its own publish
      # sends no make_latest, and GitHub marks a release it publishes that
      # way Latest, so make_latest false was lost and v0.1.3360, rerun after
      # a timestamp failure, took the mark from v0.1.3362 (11-09). gh
      # publishes it below with the mark decided above. A rerun over a
      # published release keeps it published.
      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ env.VERSION }}
          name: magpie v${{ env.VERSION }}
          draft: true
          make_latest: ${{ steps.latest.outputs.make }}
          body_path: ${{ runner.temp }}/changelog.md
          files: dist/*

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE: ${{ steps.latest.outputs.make }}
        run: gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --draft=false --latest="$MAKE"

      # Two releases publishing at once can each decide before the other
      # is out, so the mark is checked again once this one is: the highest
      # published release has it.
      - name: Latest stays on the newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: tap/scripts/latest.sh mark "$GITHUB_REPOSITORY"

      - name: Probe Discord webhook
        id: discord
        env:
          HOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Discord webhook not set — skipping announcement."
          fi

      - name: Post to Discord
        if: steps.discord.outputs.enabled == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          MESSAGE="## magpie v$VERSION

          $(cat $RUNNER_TEMP/changelog-en.md)

          **Download:** ${RELEASE_URL}"
          if [ ${#MESSAGE} -gt 1990 ]; then
            MESSAGE="${MESSAGE:0:1987}..."
          fi
          jq -n --arg content "$MESSAGE" '{content: $content}' | \
            curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      # Runs last, so a tap failure cannot swallow the announcement of a release
      # that is already public. Only tag refs reach the tap: a manual dispatch
      # from a branch builds and publishes, but must not move stable installs.
      # Nor does a release published after a newer one (steps.latest): the
      # tap went back from v0.1.1892 to 1891 on 10-28.
      - name: Update Homebrew tap
        if: (startsWith(env.REF, 'v') || startsWith(env.REF, 'refs/tags/v')) && steps.latest.outputs.make == 'true'
        env:
          TAP_RELEASE_REPO: ${{ github.repository }}
        run: |
          cd tap
          ./scripts/update-tap.sh "$VERSION"
          git add -A
          if git diff --cached --quiet; then
            echo "Tap is already at v$VERSION."
